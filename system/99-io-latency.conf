# Keep writeback bursts from freezing the desktop.
# Default dirty_ratio=20% of 31 GB lets ~6 GB of dirty pages pile up,
# then everything blocks on the disk while it flushes.
#
# 2026-10-30: tightened after measuring sda at 16.8 MB/s sustained write
# (vs 246 MB/s read). It cannot drain a 1 GB dirty allowance fast enough.
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456
