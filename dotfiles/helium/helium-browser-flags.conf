# Helium browser flags (read every launch via helium-wrapper).
# Source of truth: dotfiles/helium/helium-browser-flags.conf (symlinked to ~/.config/helium-browser-flags.conf)

--disable-accelerated-video-decode

# REMOVED 2026-10-09: --ozone-platform=x11
# Was: force XWayland to avoid NVIDIA native-Wayland DRM hangs
# (Xid 32 / NvKmsKapiMemory map failures on Pascal).
# Why removed: on XWayland every menu/popup becomes an X window and Hyprland
# blurs its transparent padding -> blurred halo around all browser menus
# (context menus, dropdowns, three-dot menu).
# Rollback if the NVIDIA hangs return: uncomment the line below.
# --ozone-platform=x11
