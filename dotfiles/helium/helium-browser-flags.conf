# Helium browser flags (read every launch via helium-wrapper).
# Source of truth: dotfiles/helium/helium-browser-flags.conf (symlinked to ~/.config/helium-browser-flags.conf)

--disable-accelerated-video-decode

# Decided 2026-10-30: video streaming writes every HLS segment into the disk
# cache (~500-850 MB in minutes). On this drive a 40 MB/5s burst of scattered
# 4k writes pegs sda at 100% busy while moving only 7 MB/s, dirty pages pile
# up and PSI io full hits 60-70% -- the whole desktop freezes in D state.
# tmpfs never touches the disk; 512 MB caps what it can take from RAM.
# Diagnosed with: diskwatch at 10:58 10
--disk-cache-dir=/dev/shm/helium-cache
--disk-cache-size=536870912

# Decided 2026-10-19: XWayland. Native matrix on GTX 1060 + nvidia 580 is
# fully exhausted (default GL freezes on video, Vulkan draws a blank
# viewport, no-sandbox still freezes, SwiftShader is unusably slow;
# 610 dropped Pascal so no driver update). The fullscreen paint gap is a
# Chromium X11-backend issue, tracked for upstream report.
--ozone-platform=x11
