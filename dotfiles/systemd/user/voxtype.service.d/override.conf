[Service]
# Shadow wtype (broken virtual keymap here, yet exits 0) so voxtype's
# paste keystroke + auto-submit Enter fall through to ydotool (uinput),
# which is the only synthetic path that reaches XWayland windows.
# Requires: ydotoold running (systemctl --user enable --now ydotoold).
Environment=PATH=/home/joao/.local/share/voxtype-shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
