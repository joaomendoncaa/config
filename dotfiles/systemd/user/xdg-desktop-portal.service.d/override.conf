# Fix: apps launched through the portal (e.g. browser links from Telegram)
# inherit the portal daemon's working directory. systemd services default to
# cwd=/, and Chromium's process-singleton handoff embeds the client's cwd in
# the message. A handoff with cwd=/ makes the running browser fail URL fixup
# and open the link in a NEW WINDOW instead of a tab (startup_browser_creator
# falls back to BrowserOpenBehavior::NEW). Give the daemon a sane cwd so
# spawned apps hand off correctly.
[Service]
WorkingDirectory=%h
